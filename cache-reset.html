<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Memperbarui Label PosIND</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f9fd;color:#102f70}.card{width:min(520px,100%);padding:32px;border:1px solid #d9e2f1;border-radius:24px;background:#fff;box-shadow:0 18px 45px rgba(16,47,112,.10)}h1{margin:0 0 12px;font-size:clamp(24px,5vw,34px)}p{margin:0;line-height:1.65;color:#5e6f91}.spinner{width:38px;height:38px;margin-bottom:22px;border:4px solid #dbe5f6;border-top-color:#f04422;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="card">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Memperbarui aplikasi…</h1>
    <p id="status">Cache versi lama sedang dibersihkan. Halaman utama akan dibuka otomatis.</p>
  </main>
  <script src="cache-reset.js?v=7.1"></script>
